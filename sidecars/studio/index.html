<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boot Studio</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/logo.svg" alt="Boot Studio" />
        <div class="brand-text">
          <div class="brand-title">Antigravity Boot Studio</div>
          <div class="brand-sub" id="hdr-engine-meta">正在连接浮层引擎…</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="status-pill" id="hdr-stage-pill">检测中</span>
        <button type="button" class="icon-btn" id="btn-theme-toggle" title="切换明暗主题">🌓</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Boot Studio 面板">
      <button type="button" class="tab-btn active" data-tab="stage">播控台</button>
      <button type="button" class="tab-btn" data-tab="themes">主题画廊</button>
      <button type="button" class="tab-btn" data-tab="smart">智能守护</button>
      <button type="button" class="tab-btn" data-tab="diag">诊断日志</button>
    </nav>

    <main class="viewport">
      <section id="pane-stage" class="pane"></section>
      <section id="pane-themes" class="pane hidden"></section>
      <section id="pane-smart" class="pane hidden"></section>
      <section id="pane-diag" class="pane hidden"></section>
    </main>
  </div>

  <!-- Custom Theme Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">创建自定义主题</h3>
        <button type="button" class="icon-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
